version: '3.8'

services:
  db:
    image: postgres:13
    container_name: db
    environment:
      - POSTGRES_DB=mediatheque
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    networks:
      - media_network
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    image: node:16
    container_name: backend
    networks:
      - media_network
    environment:
      - NODE_ENV=development
      - PORT=3000
    depends_on:
      - db
  
  frontend:
    image: nginx:1.21
    container_name: frontend
    networks:
      - media_network
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  db_data:
    driver: local

networks:
  media_network:
    driver: bridge
